# Shopist EC2 instances and security groups
# WARNING: intentionally misconfigured for Datadog IaC Security demo

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Shopist EC2 instances and security groups (intentionally misconfigured for Datadog IaC Security demo)

Resources:
  ShopistVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: shopist-vpc
        - Key: Project
          Value: shopist

  ShopistAppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: shopist-app-sg
      GroupDescription: Security group for Shopist application servers
      VpcId: !Ref ShopistVpc
      SecurityGroupIngress:
        # VULN 1: Security group allows SSH (port 22) from any IP address
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0  # VULN 1: SSH open to the entire internet
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: shopist
        - Key: Environment
          Value: production

  ShopistAdminSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: shopist-admin-sg
      GroupDescription: Security group for Shopist admin bastion
      VpcId: !Ref ShopistVpc
      SecurityGroupIngress:
        # VULN 2: Security group allows RDP (port 3389) from any IP address
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: 0.0.0.0/0  # VULN 2: RDP open to the entire internet
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: shopist
        - Key: Environment
          Value: production

  ShopistApiServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0c02fb55956c7d316
      InstanceType: t3.medium
      SecurityGroupIds:
        - !Ref ShopistAppSecurityGroup
      # VULN 3: EC2 instance does not enforce IMDSv2 — vulnerable to SSRF-based metadata theft
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: optional  # VULN 3: IMDSv2 not required (should be "required")
        HttpPutResponseHopLimit: 2  # hop limit > 1 allows container escape to metadata
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            Encrypted: false  # VULN 4: Root volume not encrypted
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: shopist-api-server
        - Key: Project
          Value: shopist
        - Key: Environment
          Value: production

  # VULN 5: EBS volume not encrypted — contains customer order data
  ShopistDataVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: us-east-1a
      Size: 100
      Encrypted: false  # VULN 5: Unencrypted EBS volume with sensitive data
      Tags:
        - Key: Name
          Value: shopist-data-volume
        - Key: Project
          Value: shopist
